version: '3.8'

services:
  ufs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-file-studio
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_CONCURRENT_JOBS=4
      - MAX_UPLOAD_SIZE_MB=4096
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3


<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UFS Studio" />
    <meta name="description" content="Universal File Studio - Local-First Multi-Engine Media and Document Studio" />
    <link rel="manifest" href="/manifest.json" />
    <title>Universal File Studio | Local Media & Document Studio</title>
  </head>
  <body class="bg-surface-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        // In native Android Capacitor WebViews, unregister service workers to avoid stale hash chunk caching
        const isNative = Boolean(
          window.Capacitor?.isNativePlatform?.() || 
          window.location.hostname === 'localhost' ||
          navigator.userAgent.includes('wv')
        );

        if ('serviceWorker' in navigator) {
          if (isNative) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
          } else if (window.location.protocol.startsWith('http')) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
          }
        }
      })();
    </script>
  </body>
</html>
